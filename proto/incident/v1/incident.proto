// gRPC contract between the Correlation Engine (client) and the
// Incident Management Service (server). Field names are snake_case here and
// camelCase in JS (proto-loader keepCase:false).
syntax = "proto3";

package incident.v1;

service IncidentService {
  // Create or update the incident for a correlation decision. Runs a 3PC
  // transaction across Postgres and the Event Store. Returns ABORTED when the
  // transaction aborts, INVALID_ARGUMENT for a bad request.
  rpc UpsertIncident(UpsertIncidentRequest) returns (Incident);
  rpc GetIncident(GetIncidentRequest) returns (Incident);
}

message UpsertIncidentRequest {
  string correlation_id = 1;
  string entity_key = 2;
  string title = 3;
  string severity = 4;                    // low | medium | high | critical
  repeated string alert_ids = 5;
  repeated string rule_ids = 6;
  string first_seen = 7;                  // UTC ISO-8601
  string last_seen = 8;                   // UTC ISO-8601
  int32 event_count = 9;
  repeated string related_event_ids = 10;
  string entity_json = 11;                // JSON object, e.g. {"srcIp":"...","userId":null,"host":null}
  string enrichment_json = 12;            // JSON object or "" / "null" when enrichment failed
}

message GetIncidentRequest {
  string incident_id = 1;
}

message Incident {
  string incident_id = 1;
  string correlation_id = 2;
  string entity_key = 3;
  string title = 4;
  string severity = 5;
  string status = 6;                      // open | investigating | resolved | false_positive
  int32 alert_count = 7;
  int32 event_count = 8;
  string first_seen = 9;
  string last_seen = 10;
  int32 version = 11;
  string created_at = 12;
  string updated_at = 13;
  string outcome = 14;                    // created | updated | noop (UpsertIncident only)
}
