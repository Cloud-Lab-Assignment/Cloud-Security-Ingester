# CI: test -> build 6 images -> push to Artifact Registry -> bump image tags in
# gitops/ (Git commit). Argo CD then syncs the new tag. CI never talks to the
# cluster (no kubectl apply).
#
# One-time setup (see docs/DEPLOYMENT.md):
#   - GitHub repo secret:    GCP_SA_KEY  (terraform output -raw ci_service_account_key | base64 -d)
#   - GitHub repo variables: GCP_PROJECT_ID, GCP_REGION (default asia-south1)
name: ci

on:
  push:
    branches: [main]
    paths-ignore:
      - "gitops/**"        # the tag-bump commit must not retrigger CI
      - "docs/**"
      - "infra/**"
  pull_request:

env:
  GCP_REGION: ${{ vars.GCP_REGION || 'asia-south1' }}
  REGISTRY: ${{ vars.GCP_REGION || 'asia-south1' }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/cloud-sec

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: detection-rules tests
        run: npm ci && KAFKA_BROKERS=localhost:9092 node --test
        working-directory: services/detection-rules
      - name: event-normalizer tests
        run: npm ci && KAFKA_BROKERS=localhost:9092 node --test
        working-directory: services/event-normalizer
      - name: security-analytics (Flink job) unit tests
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 11  # Dataproc's Flink runtime
          cache: maven
      - run: mvn -q -B test
        working-directory: services/security-analytics

  # Secrets can't be tested in a job-level `if`, so check them here once.
  publish-config:
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - id: check
        env:
          KEY: ${{ secrets.GCP_SA_KEY }}
          PROJECT: ${{ vars.GCP_PROJECT_ID }}
        run: |
          if [ -n "$KEY" ] && [ -n "$PROJECT" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Image publishing skipped: set the GCP_SA_KEY secret and GCP_PROJECT_ID variable (docs/DEPLOYMENT.md section 4)."
          fi

  images:
    needs: [test, publish-config]
    # Skipped (not failed) until the GCP_SA_KEY secret and GCP_PROJECT_ID variable exist.
    if: github.event_name == 'push' && needs.publish-config.outputs.ready == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # name                       dockerfile                                    build context
          - { name: log-ingestion,          file: services/log-ingestion/Dockerfile,          context: services/log-ingestion }
          - { name: detection-rules,        file: services/detection-rules/Dockerfile,        context: services/detection-rules }
          - { name: event-store,            file: services/event-store/Dockerfile,            context: . }
          - { name: incident-management,    file: services/incident-management/Dockerfile,    context: . }
          - { name: correlation-engine,     file: services/correlation-engine/Dockerfile,     context: . }
          - { name: investigation-query-api, file: services/investigation-query-api/Dockerfile, context: . }
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Log in to Artifact Registry
        run: gcloud auth configure-docker "${GCP_REGION}-docker.pkg.dev" --quiet
      - name: Build and push
        run: |
          IMAGE="${REGISTRY}/${{ matrix.name }}"
          docker build -f "${{ matrix.file }}" -t "$IMAGE:${GITHUB_SHA::7}" "${{ matrix.context }}"
          docker push "$IMAGE:${GITHUB_SHA::7}"

  bump-tags:
    needs: images
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Point every service at the new tag
        run: |
          TAG="${GITHUB_SHA::7}"
          for f in gitops/services/*/kustomization.yaml; do
            sed -i "s/newTag: .*/newTag: ${TAG}/" "$f"
          done
      - name: Commit (GitOps source of truth)
        run: |
          git config user.name  "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          git add gitops
          git diff --cached --quiet || git commit -m "ci: deploy ${GITHUB_SHA::7} [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
