# Picked up by the Grafana sidecar (label grafana_dashboard=1).
# Metric names assume the shared buildApp()/log-ingestion metrics: http_requests_total{status},
# http_request_duration_seconds_bucket. Service must expose /metrics.
apiVersion: v1
kind: ConfigMap
metadata:
  name: cloud-sec-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  cloud-sec.json: |
    {
      "title": "Cloud Security Monitoring",
      "uid": "cloud-sec-overview",
      "schemaVersion": 39,
      "refresh": "10s",
      "time": {"from": "now-30m", "to": "now"},
      "panels": [
        {"id": 1, "type": "timeseries", "title": "Request rate (RPS) by service",
         "gridPos": {"x": 0, "y": 0, "w": 12, "h": 8},
         "targets": [{"expr": "sum by (service) (rate(http_requests_total{namespace=\"cloud-sec\"}[1m]))", "legendFormat": "{{service}}"}]},
        {"id": 2, "type": "timeseries", "title": "Error rate (5xx %)",
         "gridPos": {"x": 12, "y": 0, "w": 12, "h": 8},
         "fieldConfig": {"defaults": {"unit": "percentunit"}},
         "targets": [{"expr": "sum by (service) (rate(http_requests_total{namespace=\"cloud-sec\",status=~\"5..\"}[1m])) / sum by (service) (rate(http_requests_total{namespace=\"cloud-sec\"}[1m]))", "legendFormat": "{{service}}"}]},
        {"id": 3, "type": "timeseries", "title": "Latency p50 / p95 / p99",
         "gridPos": {"x": 0, "y": 8, "w": 12, "h": 8},
         "fieldConfig": {"defaults": {"unit": "s"}},
         "targets": [
           {"expr": "histogram_quantile(0.50, sum by (le) (rate(http_request_duration_seconds_bucket{namespace=\"cloud-sec\"}[1m])))", "legendFormat": "p50"},
           {"expr": "histogram_quantile(0.95, sum by (le) (rate(http_request_duration_seconds_bucket{namespace=\"cloud-sec\"}[1m])))", "legendFormat": "p95"},
           {"expr": "histogram_quantile(0.99, sum by (le) (rate(http_request_duration_seconds_bucket{namespace=\"cloud-sec\"}[1m])))", "legendFormat": "p99"}]},
        {"id": 4, "type": "timeseries", "title": "HPA replicas (current vs desired)",
         "gridPos": {"x": 12, "y": 8, "w": 12, "h": 8},
         "targets": [
           {"expr": "kube_horizontalpodautoscaler_status_current_replicas{namespace=\"cloud-sec\"}", "legendFormat": "{{horizontalpodautoscaler}} current"},
           {"expr": "kube_horizontalpodautoscaler_status_desired_replicas{namespace=\"cloud-sec\"}", "legendFormat": "{{horizontalpodautoscaler}} desired"}]},
        {"id": 5, "type": "timeseries", "title": "Pod CPU (cores) by pod",
         "gridPos": {"x": 0, "y": 16, "w": 12, "h": 8},
         "targets": [{"expr": "sum by (pod) (rate(container_cpu_usage_seconds_total{namespace=\"cloud-sec\",container!=\"\"}[1m]))", "legendFormat": "{{pod}}"}]},
        {"id": 6, "type": "timeseries", "title": "Pod memory (bytes) by pod",
         "gridPos": {"x": 12, "y": 16, "w": 12, "h": 8},
         "fieldConfig": {"defaults": {"unit": "bytes"}},
         "targets": [{"expr": "sum by (pod) (container_memory_working_set_bytes{namespace=\"cloud-sec\",container!=\"\"})", "legendFormat": "{{pod}}"}]},
        {"id": 7, "type": "stat", "title": "Nodes Ready",
         "gridPos": {"x": 0, "y": 24, "w": 6, "h": 4},
         "targets": [{"expr": "sum(kube_node_status_condition{condition=\"Ready\",status=\"true\"})"}]},
        {"id": 8, "type": "stat", "title": "Pods not Running",
         "gridPos": {"x": 6, "y": 24, "w": 6, "h": 4},
         "targets": [{"expr": "sum(kube_pod_status_phase{namespace=\"cloud-sec\",phase!~\"Running|Succeeded\"})"}]},
        {"id": 9, "type": "timeseries", "title": "Container restarts",
         "gridPos": {"x": 12, "y": 24, "w": 12, "h": 4},
         "targets": [{"expr": "sum by (pod) (increase(kube_pod_container_status_restarts_total{namespace=\"cloud-sec\"}[5m]))", "legendFormat": "{{pod}}"}]},
        {"id": 10, "type": "logs", "title": "Application logs (Loki)",
         "gridPos": {"x": 0, "y": 28, "w": 24, "h": 10},
         "datasource": {"type": "loki", "uid": "loki"},
         "targets": [{"expr": "{namespace=\"cloud-sec\"}"}]}
      ]
    }
