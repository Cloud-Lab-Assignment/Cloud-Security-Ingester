# Picked up by the Grafana sidecar (label grafana_dashboard=1) and deployed by Argo CD.
# Edit the JSON here and push; do not edit the dashboard in the Grafana UI (a sync overwrites it).
# Metric sources: http_requests_total / http_request_duration_seconds (every HTTP service,
# label `service`), kube-state-metrics + cAdvisor (HPA, pods, nodes), and service counters
# alerts_consumed_total, incidents_upserted_total, tpc_transactions_total,
# events_consumed_total, grpc_requests_total, outbox_held_rows.
apiVersion: v1
kind: ConfigMap
metadata:
  name: cloud-sec-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  cloud-sec.json: |
    {
      "title": "Cloud Security Monitoring",
      "uid": "cloud-sec-overview",
      "schemaVersion": 39,
      "version": 2,
      "refresh": "5s",
      "time": {
        "from": "now-15m",
        "to": "now"
      },
      "timepicker": {
        "refresh_intervals": [
          "5s",
          "10s",
          "30s",
          "1m"
        ]
      },
      "tags": [
        "cloud-sec"
      ],
      "panels": [
        {
          "id": 1,
          "type": "row",
          "title": "Overview",
          "collapsed": false,
          "gridPos": {
            "x": 0,
            "y": 0,
            "w": 24,
            "h": 1
          },
          "panels": []
        },
        {
          "id": 2,
          "type": "stat",
          "title": "Nodes Ready",
          "gridPos": {
            "x": 0,
            "y": 1,
            "w": 3,
            "h": 4
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 1
                  },
                  {
                    "color": "green",
                    "value": 2
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "background",
            "graphMode": "area",
            "textMode": "value"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(kube_node_status_condition{condition=\"Ready\",status=\"true\"})"
            }
          ],
          "description": "GKE nodes. The cluster autoscaler grows this from 2 to 3 when pods do not fit."
        },
        {
          "id": 3,
          "type": "stat",
          "title": "Pods Running",
          "gridPos": {
            "x": 3,
            "y": 1,
            "w": 3,
            "h": 4
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "green",
                    "value": 6
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "background",
            "graphMode": "area",
            "textMode": "value"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(kube_pod_status_phase{namespace=\"cloud-sec\",phase=\"Running\"})"
            }
          ]
        },
        {
          "id": 4,
          "type": "stat",
          "title": "Pods not Running",
          "gridPos": {
            "x": 6,
            "y": 1,
            "w": 3,
            "h": 4
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 1
                  },
                  {
                    "color": "red",
                    "value": 5
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "background",
            "graphMode": "area",
            "textMode": "value"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(kube_pod_status_phase{namespace=\"cloud-sec\",phase=~\"Pending|Failed|Unknown\"}) or vector(0)"
            }
          ],
          "description": "Pending pods under load mean the node pool is at its 3-node cap."
        },
        {
          "id": 5,
          "type": "stat",
          "title": "log-ingestion pods",
          "gridPos": {
            "x": 9,
            "y": 1,
            "w": 3,
            "h": 4
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 3
                  },
                  {
                    "color": "red",
                    "value": 6
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "background",
            "graphMode": "area",
            "textMode": "value"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "kube_horizontalpodautoscaler_status_current_replicas{namespace=\"cloud-sec\",horizontalpodautoscaler=\"log-ingestion\"}"
            }
          ],
          "description": "HPA range is 2 to 8."
        },
        {
          "id": 6,
          "type": "stat",
          "title": "Total requests/s",
          "gridPos": {
            "x": 12,
            "y": 1,
            "w": 3,
            "h": 4
          },
          "fieldConfig": {
            "defaults": {
              "unit": "reqps",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "blue",
                    "value": null
                  }
                ]
              },
              "decimals": 1
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "background",
            "graphMode": "area",
            "textMode": "value"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(rate(http_requests_total{namespace=\"cloud-sec\"}[1m])) or vector(0)"
            }
          ]
        },
        {
          "id": 7,
          "type": "stat",
          "title": "Error rate (5xx)",
          "gridPos": {
            "x": 15,
            "y": 1,
            "w": 3,
            "h": 4
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 0.01
                  },
                  {
                    "color": "red",
                    "value": 0.02
                  }
                ]
              },
              "decimals": 2
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "background",
            "graphMode": "area",
            "textMode": "value"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "(sum(rate(http_requests_total{namespace=\"cloud-sec\",status=~\"5..\"}[1m])) / sum(rate(http_requests_total{namespace=\"cloud-sec\"}[1m]))) or vector(0)"
            }
          ],
          "description": "k6 threshold is under 2%."
        },
        {
          "id": 8,
          "type": "stat",
          "title": "p95 latency",
          "gridPos": {
            "x": 18,
            "y": 1,
            "w": 3,
            "h": 4
          },
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 0.5
                  },
                  {
                    "color": "red",
                    "value": 0.8
                  }
                ]
              },
              "decimals": 3
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "background",
            "graphMode": "area",
            "textMode": "value"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "histogram_quantile(0.95, sum by (le) (rate(http_request_duration_seconds_bucket{namespace=\"cloud-sec\"}[1m])))"
            }
          ],
          "description": "k6 threshold is under 800 ms."
        },
        {
          "id": 9,
          "type": "stat",
          "title": "Incidents (1h)",
          "gridPos": {
            "x": 21,
            "y": 1,
            "w": 3,
            "h": 4
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "blue",
                    "value": null
                  }
                ]
              },
              "decimals": 0
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "background",
            "graphMode": "area",
            "textMode": "value"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(increase(incidents_upserted_total{outcome=\"created\"}[1h])) or vector(0)"
            }
          ]
        },
        {
          "id": 10,
          "type": "row",
          "title": "Autoscaling (requirement c)",
          "collapsed": false,
          "gridPos": {
            "x": 0,
            "y": 5,
            "w": 24,
            "h": 1
          },
          "panels": []
        },
        {
          "id": 11,
          "type": "timeseries",
          "title": "HPA replicas: current vs desired",
          "gridPos": {
            "x": 0,
            "y": 6,
            "w": 12,
            "h": 8
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "custom": {
                "lineWidth": 2,
                "fillOpacity": 0,
                "showPoints": "never",
                "spanNulls": true
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "lastNotNull",
                "max"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "refId": "A",
              "expr": "kube_horizontalpodautoscaler_status_current_replicas{namespace=\"cloud-sec\"}",
              "legendFormat": "{{horizontalpodautoscaler}} current"
            },
            {
              "refId": "B",
              "expr": "kube_horizontalpodautoscaler_status_desired_replicas{namespace=\"cloud-sec\"}",
              "legendFormat": "{{horizontalpodautoscaler}} desired"
            }
          ],
          "description": "Desired above current for a while means pods are Pending (no node room) or still starting."
        },
        {
          "id": 12,
          "type": "timeseries",
          "title": "CPU as % of request, per pod (what the HPA watches)",
          "gridPos": {
            "x": 12,
            "y": 6,
            "w": 12,
            "h": 8
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "custom": {
                "lineWidth": 2,
                "fillOpacity": 5,
                "showPoints": "never",
                "spanNulls": true,
                "thresholdsStyle": {
                  "mode": "line"
                }
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 0.5
                  },
                  {
                    "color": "red",
                    "value": 0.7
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "lastNotNull",
                "max"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (pod) (rate(container_cpu_usage_seconds_total{namespace=\"cloud-sec\",container!=\"\"}[1m])) / sum by (pod) (kube_pod_container_resource_requests{namespace=\"cloud-sec\",resource=\"cpu\"})",
              "legendFormat": "{{pod}}"
            }
          ],
          "description": "log-ingestion scales out when its average crosses 50%. Others: detection-rules 60%, correlation-engine 70%, event-store 70%."
        },
        {
          "id": 13,
          "type": "timeseries",
          "title": "Available pods per Deployment",
          "gridPos": {
            "x": 0,
            "y": 14,
            "w": 8,
            "h": 7
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "custom": {
                "lineWidth": 2,
                "fillOpacity": 0,
                "showPoints": "never",
                "spanNulls": true
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "lastNotNull",
                "max"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "refId": "A",
              "expr": "kube_deployment_status_replicas_available{namespace=\"cloud-sec\"}",
              "legendFormat": "{{deployment}}"
            }
          ]
        },
        {
          "id": 14,
          "type": "timeseries",
          "title": "Cluster nodes",
          "gridPos": {
            "x": 8,
            "y": 14,
            "w": 8,
            "h": 7
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "custom": {
                "lineWidth": 2,
                "fillOpacity": 0,
                "showPoints": "never",
                "spanNulls": true
              },
              "min": 0
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "lastNotNull",
                "max"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "refId": "A",
              "expr": "count(kube_node_info)",
              "legendFormat": "nodes"
            },
            {
              "refId": "B",
              "expr": "sum(kube_node_status_condition{condition=\"Ready\",status=\"true\"})",
              "legendFormat": "ready"
            }
          ]
        },
        {
          "id": 15,
          "type": "timeseries",
          "title": "Pending pods",
          "gridPos": {
            "x": 16,
            "y": 14,
            "w": 8,
            "h": 7
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "custom": {
                "lineWidth": 2,
                "fillOpacity": 20,
                "showPoints": "never",
                "spanNulls": true
              },
              "min": 0
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "lastNotNull",
                "max"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(kube_pod_status_phase{namespace=\"cloud-sec\",phase=\"Pending\"})",
              "legendFormat": "pending"
            }
          ],
          "description": "Non-zero while scaling out means the 3-node cap (24 vCPU free-trial quota) is reached."
        },
        {
          "id": 16,
          "type": "row",
          "title": "Load and latency (k6 stress test)",
          "collapsed": false,
          "gridPos": {
            "x": 0,
            "y": 21,
            "w": 24,
            "h": 1
          },
          "panels": []
        },
        {
          "id": 17,
          "type": "timeseries",
          "title": "Requests per second by service",
          "gridPos": {
            "x": 0,
            "y": 22,
            "w": 12,
            "h": 8
          },
          "fieldConfig": {
            "defaults": {
              "unit": "reqps",
              "custom": {
                "lineWidth": 2,
                "fillOpacity": 15,
                "showPoints": "never",
                "spanNulls": true,
                "stacking": {
                  "mode": "normal",
                  "group": "A"
                }
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "lastNotNull",
                "max"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (service) (rate(http_requests_total{namespace=\"cloud-sec\"}[1m]))",
              "legendFormat": "{{service}}"
            }
          ]
        },
        {
          "id": 18,
          "type": "timeseries",
          "title": "Responses by status code",
          "gridPos": {
            "x": 12,
            "y": 22,
            "w": 12,
            "h": 8
          },
          "fieldConfig": {
            "defaults": {
              "unit": "reqps",
              "custom": {
                "lineWidth": 2,
                "fillOpacity": 15,
                "showPoints": "never",
                "spanNulls": true,
                "stacking": {
                  "mode": "normal",
                  "group": "A"
                }
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "lastNotNull",
                "max"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (status) (rate(http_requests_total{namespace=\"cloud-sec\"}[1m]))",
              "legendFormat": "{{status}}"
            }
          ],
          "description": "2xx/202 is the pipeline accepting events; any 5xx is a failure."
        },
        {
          "id": 19,
          "type": "timeseries",
          "title": "Latency p50 / p95 / p99 (all services)",
          "gridPos": {
            "x": 0,
            "y": 30,
            "w": 12,
            "h": 8
          },
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "custom": {
                "lineWidth": 2,
                "fillOpacity": 0,
                "showPoints": "never",
                "spanNulls": true,
                "thresholdsStyle": {
                  "mode": "line"
                }
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "red",
                    "value": 0.8
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "lastNotNull",
                "max"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "refId": "A",
              "expr": "histogram_quantile(0.5, sum by (le) (rate(http_request_duration_seconds_bucket{namespace=\"cloud-sec\"}[1m])))",
              "legendFormat": "p50"
            },
            {
              "refId": "B",
              "expr": "histogram_quantile(0.95, sum by (le) (rate(http_request_duration_seconds_bucket{namespace=\"cloud-sec\"}[1m])))",
              "legendFormat": "p95"
            },
            {
              "refId": "C",
              "expr": "histogram_quantile(0.99, sum by (le) (rate(http_request_duration_seconds_bucket{namespace=\"cloud-sec\"}[1m])))",
              "legendFormat": "p99"
            }
          ],
          "description": "Red line = the k6 p95 threshold (800 ms)."
        },
        {
          "id": 20,
          "type": "timeseries",
          "title": "p95 latency by service",
          "gridPos": {
            "x": 12,
            "y": 30,
            "w": 12,
            "h": 8
          },
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "custom": {
                "lineWidth": 2,
                "fillOpacity": 0,
                "showPoints": "never",
                "spanNulls": true
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "lastNotNull",
                "max"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "refId": "A",
              "expr": "histogram_quantile(0.95, sum by (le, service) (rate(http_request_duration_seconds_bucket{namespace=\"cloud-sec\"}[1m])))",
              "legendFormat": "{{service}}"
            }
          ]
        },
        {
          "id": 21,
          "type": "timeseries",
          "title": "Error rate (5xx) by service",
          "gridPos": {
            "x": 0,
            "y": 38,
            "w": 12,
            "h": 7
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "custom": {
                "lineWidth": 2,
                "fillOpacity": 0,
                "showPoints": "never",
                "spanNulls": true,
                "thresholdsStyle": {
                  "mode": "line"
                }
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "red",
                    "value": 0.02
                  }
                ]
              },
              "min": 0
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "lastNotNull",
                "max"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (service) (rate(http_requests_total{namespace=\"cloud-sec\",status=~\"5..\"}[1m])) / sum by (service) (rate(http_requests_total{namespace=\"cloud-sec\"}[1m]))",
              "legendFormat": "{{service}}"
            }
          ]
        },
        {
          "id": 22,
          "type": "timeseries",
          "title": "log-ingestion requests by route",
          "gridPos": {
            "x": 12,
            "y": 38,
            "w": 12,
