apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: log-ingestion
  namespace: argocd
  finalizers: [resources-finalizer.argocd.argoproj.io]
spec:
  project: default
  source:
    repoURL: https://github.com/Cloud-Lab-Assignment/Cloud-Security-Ingester.git
    targetRevision: main
    path: gitops/services/log-ingestion
  destination:
    server: https://kubernetes.default.svc
    namespace: cloud-sec
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions: [CreateNamespace=true]
