apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: cloud-sec
resources:
  - deployment.yaml
  - hpa.yaml
images:
  # CI (.github/workflows/ci.yml) bumps newTag in a Git commit -> ArgoCD syncs.
  # PROJECT_ID is replaced by scripts/set-registry.sh.
  - name: asia-south1-docker.pkg.dev/PROJECT_ID/cloud-sec/detection-rules
    newTag: latest
