apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: cloud-sec
resources:
  - deployment.yaml
  - service.yaml
  - servicemonitor.yaml
images:
  # CI (.github/workflows/ci.yml) bumps newTag in a Git commit -> ArgoCD syncs.
  # ACCOUNT_ID is replaced by scripts/set-account-id.sh.
  - name: ACCOUNT_ID.dkr.ecr.ap-south-1.amazonaws.com/cloud-sec/investigation-query-api
    newTag: latest
